<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Pythagoras - De Pizzeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --success: #6BCB77;
            --danger: #FF6B6B;
            --pizza-crust: #E6A15C;
            --pizza-sauce: #D63031;
            --cheese: #FFEAA7;
            --metal: #95a5a6;
            --wood: #8e44ad;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #333;
            /* Chequered floor pattern */
            background-image:
                linear-gradient(45deg, #222 25%, transparent 25%),
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            color: var(--dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            width: 100%;
            background: white;
            padding: 0.8rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .stat-item {
            background: var(--light);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #eee;
        }

        /* GAME AREA - THE KITCHEN */
        #kitchen-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* TICKET RAIL */
        #ticket-rail {
            width: 100%;
            height: 120px;
            background: #555;
            border-bottom: 4px solid #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10px;
            box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 5;
        }

        .ticket {
            background: #fff;
            width: 300px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transform: rotate(-2deg);
            animation: slideInDown 0.5s ease-out;
            position: relative;
        }

        .ticket::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #888;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.3);
        }

        .order-text {
            font-size: 1.1rem;
            line-height: 1.4;
            font-weight: bold;
        }

        .math-highlight {
            background: #ffeb3b;
            padding: 2px 5px;
            border-radius: 4px;
        }

        /* WORKSTATION - COUNTER */
        #counter-top {
            flex: 1;
            width: 100%;
            background: #dcdde1;
            /* Stainless Steel */
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 50px 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 10px 30px rgba(0, 0, 0, 0.1);
            perspective: 1000px;
        }

        /* OVEN AREA */
        #oven-area {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
            height: 300px;
            background: #A04000;
            border-radius: 80px 80px 0 0;
            border: 8px solid #6E2C00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 1;
            overflow: hidden;
        }

        #oven-mouth {
            width: 160px;
            height: 100px;
            background: #333;
            border-radius: 60px 60px 0 0;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px #000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Fire Animation inside oven */
        #oven-fire {
            width: 100%;
            height: 40px;
            background: linear-gradient(to top, #ff4500, #ff8c00, transparent);
            opacity: 0.6;
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes flicker {
            0% {
                transform: scaleY(1);
                opacity: 0.6;
            }

            100% {
                transform: scaleY(1.2);
                opacity: 0.8;
            }
        }

        #oven-btn {
            width: 100%;
            padding: 1rem;
            background: #e74c3c;
            color: white;
            border: none;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            border-top: 4px solid #c0392b;
            transition: background 0.2s;
        }

        #oven-btn:hover {
            background: #d35400;
        }

        #oven-btn:disabled {
            background: #95a5a6;
            border-color: #7f8c8d;
            cursor: not-allowed;
        }

        /* PREP STATION */
        #prep-station {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Wood cutting board */
            background: #deb887;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), inset 0 0 40px rgba(139, 69, 19, 0.2);
            border: 8px solid #8b4513;
        }

        #pizza-board {
            width: 400px;
            height: 400px;
            position: relative;
            cursor: crosshair;
            transition: all 0.5s ease-in-out;
            z-index: 10;
        }

        #pizza-board:active {
            transform: scale(0.98);
        }

        .pizza-base {
            width: 100%;
            height: 100%;
            background: var(--pizza-crust);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2), 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 6px solid #d38c45;
        }

        .pizza-base.cooked {
            filter: brightness(0.9) sepia(0.2);
            border-color: #a65e2e;
        }

        .sauce-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: var(--pizza-sauce);
            border-radius: 50%;
            opacity: 0.95;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .cheese-layer {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;
            background: var(--cheese);
            border-radius: 50%;
            opacity: 0.9;
            background-image: radial-gradient(#ffd56b 15%, transparent 16%);
            background-size: 25px 25px;
            display: none;
            /* Showing only sauce initially for better contrast */
        }

        .topping {
            position: absolute;
            width: 40px;
            height: 40px;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.3));
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* INGREDIENT CONTAINERS */
        #ingredients-rack {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .ingredient-bin {
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 50%;
            border: 6px solid #bdc3c7;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2), inset 0 5px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .ingredient-bin:hover {
            transform: scale(1.05);
        }

        .ingredient-bin.active {
            border-color: var(--success);
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(107, 203, 119, 0.4);
        }

        .bin-icon {
            font-size: 2.5rem;
        }

        .bin-label {
            position: absolute;
            bottom: -25px;
            background: #333;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* FEEDBACK OVERLAY */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #feedback-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .feedback-card {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        #feedback-overlay.visible .feedback-card {
            transform: scale(1);
        }

        .feedback-emoji {
            font-size: 5rem;
            display: block;
            margin-bottom: 1rem;
        }

        .feedback-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 0.5rem 0;
            color: var(--dark);
        }

        .feedback-text {
            color: #555;
            margin-bottom: 2rem;
            font-size: 1.2rem;
        }

        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s;
        }

        .btn-next:hover {
            transform: scale(1.05);
        }

        /* ANIMATIONS */
        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            70% {
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes slideInDown {
            from {
                transform: translateY(-100%) rotate(0deg);
                opacity: 0;
            }

            to {
                transform: translateY(0) rotate(-2deg);
                opacity: 1;
            }
        }

        /* Pizza moving to oven */
        .pizza-baking {
            animation: move-to-oven 1s forwards ease-in-out;
            z-index: 20 !important;
        }

        @keyframes move-to-oven {
            0% {
                transform: translateX(0) scale(1);
            }

            100% {
                transform: translateX(350px) scale(0.6);
                opacity: 0;
            }
        }

        /* Progress Text */
        .progress-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <div style="font-weight:900; font-size:1.8rem; color:var(--dark); display:flex; align-items:center; gap:10px;">
            🍕 Pizza Pythagoras
        </div>
        <div class="stats">
            <div class="stat-item">
                <span style="font-size:1.5rem">📅</span>
                <span>Dag <span id="day-display">1</span></span>
            </div>
            <div class="stat-item">
                <span style="font-size:1.5rem">💰</span>
                <span>€ <span id="score-display">0</span></span>
            </div>
        </div>
    </header>

    <div id="kitchen-container">
        <!-- TOP: TICKETS -->
        <div id="ticket-rail">
            <div class="ticket">
                <div class="order-text" id="order-text">
                    Laden...
                </div>
            </div>
        </div>

        <!-- CENTER: COUNTER -->
        <div id="counter-top">

            <!-- LEFT: INGREDIENTS -->
            <div id="ingredients-rack">
                <div class="ingredient-bin active" onclick="selectTool('salami')" id="bin-salami">
                    <span class="bin-icon">🍕</span>
                    <span class="bin-label">Salami</span>
                </div>
                <div class="ingredient-bin" onclick="selectTool('olive')" id="bin-olive">
                    <span class="bin-icon">🫒</span>
                    <span class="bin-label">Olijf</span>
                </div>
                <div class="ingredient-bin" onclick="selectTool('mushroom')" id="bin-mushroom">
                    <span class="bin-icon">🍄</span>
                    <span class="bin-label">Paddenst.</span>
                </div>
            </div>

            <!-- MIDDLE: PREP STATION -->
            <div id="prep-station">
                <div id="pizza-board">
                    <div class="pizza-base" id="pizza-base">
                        <div class="sauce-layer"></div>
                        <!-- Toppings here -->
                    </div>
                </div>
                <div class="progress-indicator" id="baking-timer">3...</div>
            </div>

            <!-- RIGHT: OVEN -->
            <div id="oven-area">
                <div id="oven-mouth">
                    <div id="oven-fire"></div>
                </div>
                <button id="oven-btn" onclick="bakePizza()">
                    🔥 BAKKEN
                </button>
            </div>

        </div>
    </div>

    <!-- FEEDBACK OVERLAY -->
    <div id="feedback-overlay">
        <div class="feedback-card">
            <span class="feedback-emoji" id="fb-emoji">🤩</span>
            <h2 class="feedback-title" id="fb-title">Perfect!</h2>
            <p class="feedback-text" id="fb-text">Je hebt precies 12 salami gelegd.</p>
            <button class="btn-next" onclick="nextOrder()">Volgende Klant ➔</button>
        </div>
    </div>

    <script>
        // STATE
        let state = {
            day: 1,
            score: 0,
            activeTool: 'salami',
            currentOrder: null,
            toppingsPlaced: {
                salami: 0,
                olive: 0,
                mushroom: 0
            },
            status: 'WAITING' // WAITING, PREPPING, BAKING, SERVED
        };

        const INGREDIENTS = {
            salami: { icon: '🍕', name: 'Salami' },
            olive: { icon: '🫒', name: 'Olijven' },
            mushroom: { icon: '🍄', name: 'Champignons' }
        };

        // DOM ELEMENTS
        const pizzaBoard = document.getElementById('pizza-board');
        const pizzaBase = document.getElementById('pizza-base');
        const orderText = document.getElementById('order-text');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const ovenBtn = document.getElementById('oven-btn');
        const bakingTimer = document.getElementById('baking-timer');

        // INIT
        function init() {
            startDay();
        }

        function startDay() {
            nextOrder();
        }

        function selectTool(tool) {
            if (state.status !== 'PREPPING') return;

            state.activeTool = tool;
            // Update UI
            document.querySelectorAll('.ingredient-bin').forEach(bin => bin.classList.remove('active'));
            document.getElementById('bin-' + tool).classList.add('active');
        }

        // MATH GENERATOR
        function generateOrder() {
            const types = Object.keys(INGREDIENTS);
            const type = types[Math.floor(Math.random() * types.length)];

            // Difficulty
            let operation = (state.day > 1 && Math.random() > 0.5) ? 'mult' : 'add';

            let num1, num2, target, text;

            if (operation === 'add') {
                target = Math.floor(Math.random() * 8) + 3; // 3 to 10
                num1 = Math.floor(Math.random() * (target - 1)) + 1;
                num2 = target - num1;
                text = `Tafel 4 wil een pizza met <span class="math-highlight">${num1} + ${num2}</span> plakjes <b>${INGREDIENTS[type].name}</b>.`;
            } else {
                num1 = Math.floor(Math.random() * 3) + 2; // 2 to 4
                num2 = Math.floor(Math.random() * 3) + 2; // 2 to 4
                target = num1 * num2;
                text = `Bestelling: <span class="math-highlight">${num1} x ${num2}</span> stukjes <b>${INGREDIENTS[type].name}</b>!`;
            }

            return {
                type: type,
                target: target,
                text: text
            };
        }

        function nextOrder() {
            // Reset Board
            pizzaBase.innerHTML = '<div class="sauce-layer"></div>';
            pizzaBase.classList.remove('cooked');
            pizzaBoard.classList.remove('pizza-baking');
            pizzaBoard.style.display = 'block';
            pizzaBoard.style.transform = 'scale(1)';
            pizzaBoard.style.opacity = '1';

            state.toppingsPlaced = { salami: 0, olive: 0, mushroom: 0 };

            // Hide Feedback
            feedbackOverlay.classList.remove('visible');

            // Generate New Order
            state.currentOrder = generateOrder();
            state.status = 'PREPPING';

            // UI Text
            orderText.innerHTML = state.currentOrder.text;
            ovenBtn.textContent = "🔥 BAKKEN";
            ovenBtn.disabled = false;
        }

        // INTERACTION
        pizzaBase.addEventListener('mousedown', (e) => {
            if (state.status !== 'PREPPING') return;

            const rect = pizzaBase.getBoundingClientRect();
            // Calculate center relative to bounding client rect
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Distance from center
            const dist = Math.sqrt((clickX - centerX) ** 2 + (clickY - centerY) ** 2);

            // Allow placing only within sauce area (visually nicer)
            // Pizza is 400px (parent) -> Base 100% -> Sauce has margin 20px.
            // Radius approx 200px. Safe zone approx 160px.
            const SAFE_RADIUS = (rect.width / 2) - 40;

            if (dist < SAFE_RADIUS) {
                // Use click coordinates if valid, otherwise could clamp, but ignoring clicks outside is better teaching feedback
                addTopping(clickX, clickY);
            } else {
                // Visual feedback for clicking crust? Shake maybe?
                pizzaBoard.classList.add('wiggle');
                setTimeout(() => pizzaBoard.classList.remove('wiggle'), 500);
            }
        });

        function addTopping(x, y) {
            const tool = state.activeTool;
            state.toppingsPlaced[tool]++;

            const el = document.createElement('div');
            el.className = 'topping';
            el.textContent = INGREDIENTS[tool].icon;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            // Random rotation
            el.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg) scale(0)`;

            setTimeout(() => {
                el.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg) scale(1)`;
            }, 50);

            pizzaBase.appendChild(el);
        }

        function bakePizza() {
            if (state.status !== 'PREPPING') return;
            state.status = 'BAKING';
            ovenBtn.disabled = true;
            ovenBtn.textContent = "BAKKEN...";

            // Animation
            pizzaBoard.classList.add('pizza-baking');

            // Timer logic could go here, for now strictly visual delay
            setTimeout(() => {
                // Pizza is "in oven" (invisible)
                // Wait a bit

                setTimeout(() => {
                    // Done baking
                    finishBaking();
                }, 1500);

            }, 800);
        }

        function finishBaking() {
            // Bring pizza back but cooked
            pizzaBoard.classList.remove('pizza-baking');
            pizzaBase.classList.add('cooked');

            // Reset transforms removed by class removal
            pizzaBoard.style.transform = 'scale(1)';
            pizzaBoard.style.opacity = '1';

            // Check results
            servePizza();
        }

        function servePizza() {
            state.status = 'SERVED';

            const order = state.currentOrder;
            const placed = state.toppingsPlaced[order.type];
            const others = Object.keys(state.toppingsPlaced).reduce((sum, key) =>
                key !== order.type ? sum + state.toppingsPlaced[key] : sum, 0);

            let isCorrect = (placed === order.target) && (others === 0);

            showFeedback(isCorrect, placed, order.target, others);
        }

        function showFeedback(success, placed, target, others) {
            const title = document.getElementById('fb-title');
            const text = document.getElementById('fb-text');
            const emoji = document.getElementById('fb-emoji');

            if (success) {
                // Reward
                state.score += 10;
                document.getElementById('score-display').textContent = state.score;
                state.day = Math.floor(state.score / 50) + 1;
                document.getElementById('day-display').textContent = state.day;

                emoji.textContent = '😋';
                title.textContent = 'Heerlijk!';
                title.style.color = 'var(--success)';
                text.textContent = `Precies ${target} stukjes! Dat smaakt naar meer.`;
            } else {
                emoji.textContent = '😤';
                title.textContent = 'Dat klopt niet...';
                title.style.color = 'var(--danger)';

                if (others > 0) {
                    text.textContent = `Ik wilde alleen ${INGREDIENTS[state.currentOrder.type].name}, geen ander spul!`;
                } else if (placed < target) {
                    text.textContent = `Ik tel er maar ${placed}, maar ik wilde er ${target}!`;
                } else {
                    text.textContent = `Véél te veel! Ik tel er ${placed}, dat moesten er ${target} zijn.`;
                }
            }

            // Slight delay so they see the cooked pizza for a second
            setTimeout(() => {
                feedbackOverlay.classList.add('visible');
            }, 500);
        }

        // Initial Start
        init();

    </script>
</body>

</html>
