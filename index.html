<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Pythagoras - De Pizzeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --success: #6BCB77;
            --danger: #FF6B6B;
            --pizza-crust: #E6A15C;
            --pizza-sauce: #D63031;
            --cheese: #FFEAA7;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #333;
            background-image:
                linear-gradient(45deg, #222 25%, transparent 25%),
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            color: var(--dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            width: 100%;
            background: white;
            padding: 0.8rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            height: 70px;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .stat-item {
            background: var(--light);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #eee;
        }

        /* NAVIGATION TABS */
        #nav-tabs {
            width: 100%;
            height: 80px;
            background: #2C3E50;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.3);
            z-index: 20;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            padding: 0.5rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
            position: relative;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .nav-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: var(--dark);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .badge.visible {
            opacity: 1;
        }

        /* VIEW CONTAINER */
        #main-view {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: #dcdde1;
        }

        .station {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .station.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ================== STATION 1: PREP (Toppings) ================== */
        #station-prep {
            background: #dcdde1;
            /* Stainless Steel */
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 50px 100%;
            justify-content: flex-start;
        }

        #ticket-rail {
            width: 100%;
            min-height: 100px;
            background: #555;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .ticket {
            background: #fff;
            width: 400px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            text-align: center;
        }

        .ticket.empty {
            opacity: 0.5;
            border: 2px dashed #999;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .ticket.empty:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #prep-table {
            position: relative;
            width: 100%;
            max-width: 900px;
            flex: 1;
            display: flex;
            gap: 2rem;
            align-items: center;
            justify-content: center;
        }

        #ingredients-rack {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .ingredient-bin {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            border: 4px solid #bdc3c7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .ingredient-bin:hover {
            transform: scale(1.05);
        }

        .ingredient-bin.active {
            border-color: var(--success);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }

        .bin-label {
            position: absolute;
            bottom: -20px;
            font-size: 0.8rem;
            background: #333;
            color: white;
            padding: 2px 5px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
        }

        .ingredient-bin:hover .bin-label {
            opacity: 1;
        }

        #prep-board {
            width: 450px;
            height: 450px;
            background: #deb887;
            border-radius: 12px;
            border: 8px solid #8b4513;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .pizza-visual {
            width: 380px;
            height: 380px;
            background: var(--pizza-crust);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
            border: 6px solid #d38c45;
            transition: transform 0.2s;
            overflow: hidden;
            /* Important for manual cutting: default to no pointer events on children */
        }

        .pizza-visual .sauce {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: var(--pizza-sauce);
            border-radius: 50%;
            pointer-events: none;
        }

        .topping-item {
            position: absolute;
            width: 36px;
            height: 36px;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        #prep-controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #58a962;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .action-btn:disabled {
            background: #95a5a6;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ================== STATION 2: OVEN ================== */
        #station-oven {
            background: #5D4037;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 2rem;
            padding: 4rem;
        }

        .oven-slot {
            width: 300px;
            height: 220px;
            background: #3E2723;
            border-radius: 20px 20px 0 0;
            border: 4px solid #8D6E63;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .oven-fire {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to top, #ff5722, transparent);
            opacity: 0.3;
            animation: flicker 0.2s infinite;
        }

        .oven-timer {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 1.2rem;
        }

        .oven-temp-gauge {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 10px;
            height: 40px;
            background: #333;
            border: 1px solid #666;
            border-radius: 4px;
            overflow: hidden;
        }

        .oven-temp-fill {
            width: 100%;
            height: 0%;
            background: red;
            position: absolute;
            bottom: 0;
            transition: height 0.5s;
        }

        .oven-pizza {
            width: 200px;
            height: 200px;
            transform: scaleX(1) scaleY(0.4);
            cursor: pointer;
            transition: transform 0.2s, filter 0.5s;
        }

        .oven-pizza:hover {
            transform: scaleX(1.05) scaleY(0.42);
        }

        .oven-pizza.done {
            filter: brightness(0.7) sepia(0.4);
            border-color: #8D6E63;
        }

        /* ================== STATION 3: CUTTING ================== */
        #station-cutting {
            background: #7f8c8d;
            justify-content: center;
        }

        #cutting-board-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #cut-canvas-container {
            position: relative;
            width: 400px;
            height: 400px;
            cursor: crosshair;
        }

        /* Interactive Cutting Overlay */
        #cut-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        .cut-line-visual {
            stroke: white;
            stroke-width: 3;
            stroke-dasharray: 5 5;
            opacity: 0.8;
            filter: drop-shadow(0 0 2px black);
        }

        .slice-wedge {
            fill: rgba(255, 230, 109, 0.4);
            stroke: none;
            cursor: pointer;
            transition: fill 0.2s;
        }

        .slice-wedge:hover {
            fill: rgba(255, 230, 109, 0.6);
        }

        .slice-wedge.selected {
            fill: rgba(107, 203, 119, 0.6);
            stroke: white;
            stroke-width: 2;
        }

        #cut-instructions {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        #cut-controls-row {
            display: flex;
            gap: 1rem;
        }

        #btn-confirm-cut {
            background: var(--dark);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
        }

        #final-serve-btn {
            background: var(--accent);
            color: var(--dark);
            padding: 1rem 3rem;
            font-size: 1.5rem;
            border-radius: 50px;
            border: none;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(255, 230, 109, 0.4);
            cursor: pointer;
            margin-top: 1rem;
        }

        #final-serve-btn:hover {
            transform: scale(1.05);
        }

        /* ANIMATIONS & OVERLAYS */
        @keyframes flicker {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.5;
            }
        }

        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #feedback-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .feedback-card {
            background: white;
            padding: 2rem 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        #feedback-overlay.visible .feedback-card {
            transform: scale(1);
        }

        .heat-meter {
            width: 100%;
            height: 10px;
            background: #eee;
            margin: 10px 0;
            border-radius: 5px;
            overflow: hidden;
        }

        .heat-val {
            height: 100%;
            background: red;
            width: 80%;
        }
    </style>
</head>

<body>

    <header>
        <div style="font-weight:900; font-size:1.6rem; color:var(--dark);">🍕 Pizza Pythagoras</div>
        <div class="stats">
            <div class="stat-item"><span>📅 Dag <span id="day-display">1</span></span></div>
            <div class="stat-item"><span>💰 € <span id="score-display">0</span></span></div>
        </div>
    </header>

    <div id="main-view">

        <!-- STATION 1: PREP -->
        <div id="station-prep" class="station active">
            <div id="ticket-rail">
                <div id="active-ticket-area"></div>
            </div>

            <div id="prep-table">
                <div id="ingredients-rack">
                    <div class="ingredient-bin" onclick="setTool('salami')" id="bin-salami"><span
                            style="pointer-events:none">🍕</span>
                        <div class="bin-label">Salami</div>
                    </div>
                    <div class="ingredient-bin" onclick="setTool('olive')" id="bin-olive"><span
                            style="pointer-events:none">🫒</span>
                        <div class="bin-label">Olijf</div>
                    </div>
                    <div class="ingredient-bin" onclick="setTool('mushroom')" id="bin-mushroom"><span
                            style="pointer-events:none">🍄</span>
                        <div class="bin-label">Paddenst.</div>
                    </div>
                </div>

                <div id="prep-board">
                    <div class="pizza-visual" id="prep-pizza" onmousedown="handlePrepClick(event)">
                        <div class="sauce"></div>
                        <div id="prep-toppings-container"></div>
                    </div>
                </div>

                <div id="prep-controls">
                    <button class="action-btn" id="btn-to-oven" onclick="movePrepToOven()" disabled>Naar de Oven
                        ➡</button>
                    <button class="action-btn" style="background:#e74c3c" onclick="trashPrep()">🗑 Prullenbak</button>
                </div>
            </div>
        </div>

        <!-- STATION 2: OVEN -->
        <div id="station-oven" class="station">
            <div class="oven-slot" id="slot-0"></div>
            <div class="oven-slot" id="slot-1"></div>
            <div class="oven-slot" id="slot-2"></div>
            <div class="oven-slot" id="slot-3"></div>
        </div>

        <!-- STATION 3: CUTTING -->
        <div id="station-cutting" class="station">
            <div id="cutting-board-area" style="display:none;">
                <h2 style="color:white; margin:0;" id="cutting-header">Snijden</h2>
                <div id="cut-instructions">Sleep een lijn over de pizza om te snijden.</div>

                <div class="ticket" id="cut-ticket-display" style="width:300px; margin-bottom:1rem;"></div>

                <div id="cut-canvas-container">
                    <div class="pizza-visual cooked" id="cut-pizza-visual">
                        <div class="sauce"></div>
                        <div id="cut-toppings-container"></div>
                    </div>
                    <!-- Overlay for cuts -->
                    <svg id="cut-overlay"></svg>
                </div>

                <div id="cut-controls-row">
                    <button id="btn-confirm-cut" onclick="finishCuttingMode()">Klaar met Snijden</button>
                    <button class="action-btn" style="background:#e74c3c" onclick="resetCuts()">Opnieuw Snijden</button>
                </div>

                <button id="final-serve-btn" onclick="serveFinal()" style="display:none;">🔔 Serveren!</button>
            </div>

            <div id="cutting-empty-msg" style="color:white; font-size:1.5rem; opacity:0.6;">
                Selecteer een pizza uit de Oven om te snijden.
            </div>
        </div>

    </div>

    <!-- TABS -->
    <div id="nav-tabs">
        <button class="nav-btn active" onclick="switchStation('prep')">
            <span class="nav-icon">🥣</span>
            Toppings
        </button>
        <button class="nav-btn" onclick="switchStation('oven')">
            <span class="nav-icon">🔥</span>
            Oven
            <div class="badge" id="badge-oven">0</div>
        </button>
        <button class="nav-btn" onclick="switchStation('cutting')">
            <span class="nav-icon">🔪</span>
            Snijden
            <div class="badge" id="badge-cut">0</div>
        </button>
    </div>

    <!-- FEEDBACK -->
    <div id="feedback-overlay">
        <div class="feedback-card">
            <h2 id="res-title">Resultaat</h2>
            <div class="heat-meter">
                <div class="heat-val" id="res-heat"></div>
            </div>
            <p id="res-desc" style="text-align:left;"></p>
            <h1 id="res-score" style="font-size:3rem; color:var(--primary);">+€15</h1>
            <button class="action-btn" onclick="closeFeedback()">Doorgaan</button>
        </div>
    </div>


    <script>
        // ================= GAME LOGIC =================
        const GAME = {
            day: 1,
            money: 0,
            activeStation: 'prep',

            // Prep
            prepOrder: null,
            prepToppings: [],
            activeTool: null,

            // Oven
            ovenSlots: [null, null, null, null],

            // Cutting
            cuttingPizza: null,
            cutLines: [], // Array of {x1,y1, x2,y2} (normalized 0-1 or px)
            isSelectingMode: false,
            selectedSlices: [], // Indices of slices selected
            slices: [], // Calculated polygon slices

            // Manual Cut state
            isDragging: false,
            dragStart: null,
            dragCurrent: null
        };

        const INGREDIENTS = {
            salami: { icon: '🍕', name: 'Salami' },
            olive: { icon: '🫒', name: 'Olijven' },
            mushroom: { icon: '🍄', name: 'Champignons' }
        };

        // --- LOOP ---
        setInterval(updateOven, 100);

        function updateOven() {
            GAME.ovenSlots.forEach((pizza, idx) => {
                if (!pizza) return;
                if (pizza.state === 'BAKING') {
                    pizza.bakeTime += 0.1;
                    const BAKE_DURATION = 15.0;
                    if (pizza.bakeTime >= BAKE_DURATION) {
                        pizza.state = 'BAKED';
                        pizza.heat = 100;
                        updateOvenVisual(idx);
                        updateBadges();
                    }
                    updateOvenTimer(idx, BAKE_DURATION - pizza.bakeTime);
                } else if (pizza.state === 'BAKED') {
                    pizza.heat -= 0.2;
                    if (pizza.heat < 0) pizza.heat = 0;
                    updateOvenHeat(idx, pizza.heat);
                }
            });
        }

        // --- NAVIGATION ---
        function switchStation(name) {
            document.querySelectorAll('.station').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('station-' + name).classList.add('active');
            GAME.activeStation = name;

            const tabIdx = ['prep', 'oven', 'cutting'].indexOf(name);
            document.querySelectorAll('.nav-btn')[tabIdx].classList.add('active');

            if (name === 'oven') renderOven();
            if (name === 'cutting') renderCutting();
        }

        function updateBadges() {
            const readyCount = GAME.ovenSlots.filter(p => p && p.state === 'BAKED').length;
            const bOven = document.getElementById('badge-oven');
            bOven.textContent = readyCount;
            bOven.classList.toggle('visible', readyCount > 0);
        }

        // --- PREP ---
        function startNewOrder() {
            if (GAME.prepOrder) return;

            const types = Object.keys(INGREDIENTS);
            const type = types[Math.floor(Math.random() * types.length)];
            const isAdd = Math.random() > 0.5;
            let n1, n2, target, txt;

            if (isAdd) {
                target = Math.floor(Math.random() * 8) + 4;
                n1 = Math.floor(Math.random() * (target - 1)) + 1;
                n2 = target - n1;
                txt = `Som: <b style="color:#d35400">${n1} + ${n2}</b> x ${INGREDIENTS[type].name}`;
            } else {
                n1 = Math.floor(Math.random() * 3) + 2;
                n2 = Math.floor(Math.random() * 3) + 2;
                target = n1 * n2;
                txt = `Som: <b style="color:#d35400">${n1} x ${n2}</b> x ${INGREDIENTS[type].name}`;
            }

            // Fraction Order
            const denominators = [2, 4, 8]; // Keep it geometric (halving) for manual cut ease
            const denom = denominators[Math.floor(Math.random() * denominators.length)];
            const num = Math.floor(Math.random() * (denom - 1)) + 1; // 1 to denom

            txt += `<br>Wil graag <b>${num}/${denom}</b> pizza.`;

            GAME.prepOrder = {
                id: Date.now(),
                text: txt,
                targetType: type,
                targetCount: target,
                reqNum: num,
                reqDenom: denom
            };
            GAME.prepToppings = [];
            GAME.activeTool = null;

            renderPrepTicket();
            document.getElementById('prep-toppings-container').innerHTML = '';
            document.getElementById('btn-to-oven').disabled = false;
        }

        function renderPrepTicket() {
            const area = document.getElementById('active-ticket-area');
            if (!GAME.prepOrder) {
                area.innerHTML = '<div class="ticket empty" onclick="startNewOrder()"><span style="font-size:2rem; font-weight:bold; color:#777;">+ NIEUWE BESTELLING</span></div>';
            } else {
                area.innerHTML = `<div class="ticket"><div style="font-size:1.2rem; line-height:1.5;">${GAME.prepOrder.text}</div></div>`;
            }
        }

        function setTool(t) {
            GAME.activeTool = t;
            document.querySelectorAll('.ingredient-bin').forEach(b => b.classList.remove('active'));
            if (t) document.getElementById('bin-' + t).classList.add('active');
        }

        function handlePrepClick(e) {
            if (!GAME.prepOrder || !GAME.activeTool) return;
            const rect = document.getElementById('prep-pizza').getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const dist = Math.sqrt((x - 190) ** 2 + (y - 190) ** 2); // 380/2 = 190 radius
            if (dist > 170) return;

            const el = document.createElement('div');
            el.className = 'topping-item';
            el.textContent = INGREDIENTS[GAME.activeTool].icon;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
            document.getElementById('prep-toppings-container').appendChild(el);

            GAME.prepToppings.push({ type: GAME.activeTool, x: x, y: y });
        }

        function trashPrep() {
            GAME.prepOrder = null;
            renderPrepTicket();
            document.getElementById('prep-toppings-container').innerHTML = '';
            document.getElementById('btn-to-oven').disabled = true;
        }

        function movePrepToOven() {
            if (!GAME.prepOrder) return;
            const slotIdx = GAME.ovenSlots.findIndex(s => s === null);
            if (slotIdx === -1) {
                alert("Oven zit vol!");
                return;
            }
            GAME.ovenSlots[slotIdx] = {
                order: GAME.prepOrder,
                toppings: [...GAME.prepToppings],
                state: 'BAKING',
                bakeTime: 0,
                heat: 0
            };
            trashPrep();
        }

        // --- OVEN ---
        function renderOven() { GAME.ovenSlots.forEach((p, i) => updateOvenVisual(i)); }
        function updateOvenVisual(idx) {
            const slotEl = document.getElementById('slot-' + idx);
            const pizza = GAME.ovenSlots[idx];

            if (!pizza) { slotEl.innerHTML = ''; return; }

            // Render scaled toppings
            let toppingsHTML = '';
            pizza.toppings.forEach(t => {
                toppingsHTML += `<div style="position:absolute; left:${t.x * 0.5}px; top:${t.y * 0.5}px; font-size:12px; transform:translate(-50%, -50%); pointer-events:none;">${INGREDIENTS[t.type].icon}</div>`;
            });

            const cssClass = pizza.state === 'BAKING' ? 'baking' : 'done';
            let info = pizza.state === 'BAKING'
                ? `<div class="oven-timer" id="timer-${idx}">...</div>`
                : `<div class="oven-timer" style="background:var(--success)">KLAAR!</div><div class="oven-temp-gauge"><div class="oven-temp-fill" id="heat-${idx}" style="height:${pizza.heat}%"></div></div>`;

            slotEl.innerHTML = `
                <div class="oven-fire"></div>${info}
                <div class="pizza-visual oven-pizza ${cssClass}" onclick="clickOvenPizza(${idx})" style="width:190px; height:190px; border-width:4px;">
                    <div class="sauce"></div>${toppingsHTML}
                </div>`;
        }
        function updateOvenTimer(idx, t) { const el = document.getElementById(`timer-${idx}`); if (el) el.textContent = Math.ceil(t) + "s"; }
        function updateOvenHeat(idx, h) { const el = document.getElementById(`heat-${idx}`); if (el) { el.style.height = h + "%"; el.style.background = h < 30 ? '#3498db' : h < 60 ? '#f1c40f' : '#e74c3c'; } }

        function clickOvenPizza(idx) {
            const pizza = GAME.ovenSlots[idx];
            if (!pizza || pizza.state !== 'BAKED') return;
            if (GAME.cuttingPizza) { alert("Maak eerst de pizza op de snijplank af!"); return; }

            GAME.cuttingPizza = pizza;
            GAME.ovenSlots[idx] = null;
            renderOven();
            updateBadges();

            // Reset Cutting Stage
            GAME.cutLines = [];
            GAME.selectedSlices = [];
            GAME.isSelectingMode = false;
            switchStation('cutting');
        }

        // --- CUTTING & SELECTING ---
        function renderCutting() {
            const container = document.getElementById('cutting-board-area');
            const emptyMsg = document.getElementById('cutting-empty-msg');

            if (!GAME.cuttingPizza) {
                container.style.display = 'none'; emptyMsg.style.display = 'block';
                return;
            }
            container.style.display = 'flex'; emptyMsg.style.display = 'none';

            // Ticket
            document.getElementById('cut-ticket-display').innerHTML = `<div style="font-size:1.2rem;">${GAME.cuttingPizza.order.text}</div>`;

            // Toppings
            const topCont = document.getElementById('cut-toppings-container');
            topCont.innerHTML = '';
            GAME.cuttingPizza.toppings.forEach(t => {
                const el = document.createElement('div');
                el.className = 'topping-item';
                el.textContent = INGREDIENTS[t.type].icon;
                el.style.left = t.x + 'px';
                el.style.top = t.y + 'px';
                topCont.appendChild(el);
            });

            updateCuttingStateUI();
        }

        function updateCuttingStateUI() {
            const header = document.getElementById('cutting-header');
            const instr = document.getElementById('cut-instructions');
            const btnConfirm = document.getElementById('btn-confirm-cut');
            const btnServe = document.getElementById('final-serve-btn');
            const controls = document.getElementById('cut-controls-row');

            if (!GAME.isSelectingMode) {
                // CUTTING MODE
                header.textContent = "Stap 1: Snijden";
                instr.textContent = "Sleep rechte lijnen door het midden van de pizza.";
                btnConfirm.style.display = 'block';
                controls.style.display = 'flex';
                btnServe.style.display = 'none';

                // SVG Interaction
                setupCuttingInteraction();
            } else {
                // SELECTING MODE
                header.textContent = "Stap 2: Kiezen";
                instr.textContent = `Klik op de punten om ${GAME.cuttingPizza.order.reqNum} van de ${GAME.cuttingPizza.order.reqDenom} delen te selecteren.`;
                btnConfirm.style.display = 'none';
                controls.style.display = 'flex'; // Keep reset button
                btnServe.style.display = 'block';

                // SVG Interaction
                setupSelectionInteraction();
            }
            drawCutOverlay();
        }

        // Manual Cutting Logic
        const cutOverlay = document.getElementById('cut-overlay');

        function setupCuttingInteraction() {
            cutOverlay.onmousedown = (e) => {
                if (GAME.isSelectingMode) return;
                const r = cutOverlay.getBoundingClientRect();
                GAME.isDragging = true;
                GAME.dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
                GAME.dragCurrent = { x: e.clientX - r.left, y: e.clientY - r.top };
            };
            window.onmousemove = (e) => {
                if (!GAME.isDragging) return;
                const r = cutOverlay.getBoundingClientRect();
                GAME.dragCurrent = { x: e.clientX - r.left, y: e.clientY - r.top };
                drawCutOverlay(); // Update visual of drag line
            };
            window.onmouseup = (e) => {
                if (!GAME.isDragging) return;
                GAME.isDragging = false;
                // Finalize Cut
                addCutLine(GAME.dragStart, GAME.dragCurrent);
                drawCutOverlay();
            };
        }

        function setupSelectionInteraction() {
            cutOverlay.onmousedown = null; // Disable cut
            // Selection clicks are handled by SVG elements directly in drawCutOverlay
        }

        function addCutLine(p1, p2) {
            // Validate length
            const dist = Math.sqrt((p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2);
            if (dist < 50) return; // Too short

            // Snap to center?
            // Pizza center is 200, 200 (Container is 400x400)
            const cx = 200, cy = 200;

            // Simple logic: store the line as passing through center if it's close enough? 
            // Better: Just store the angle of the line and render full diameter.
            // Calculate angle
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

            // Store normalized line (passing through center for simplicity in this kids game)
            // Or allow non-center cuts? Requirement: "Rechte lijn". 
            // If they miss center, slices are weird. Let's auto-snap to center for gameplay feel.

            // To prevent duplicates, check angle diff
            const existing = GAME.cutLines.some(l => Math.abs(l - angle) < 0.1 || Math.abs(l - angle - Math.PI) < 0.1);
            if (!existing) {
                GAME.cutLines.push(angle);
            }
        }

        function drawCutOverlay() {
            cutOverlay.innerHTML = '';

            // Draw finalized lines
            GAME.cutLines.forEach(angle => {
                const r = 250; // plenty long
                const x1 = 200 + r * Math.cos(angle);
                const y1 = 200 + r * Math.sin(angle);
                const x2 = 200 - r * Math.cos(angle); // Diameter
                const y2 = 200 - r * Math.sin(angle);

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1); line.setAttribute("y1", y1);
                line.setAttribute("x2", x2); line.setAttribute("y2", y2);
                line.setAttribute("class", "cut-line-visual");
                cutOverlay.appendChild(line);
            });

            // Draw current drag line
            if (GAME.isDragging) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", GAME.dragStart.x); line.setAttribute("y1", GAME.dragStart.y);
                line.setAttribute("x2", GAME.dragCurrent.x); line.setAttribute("y2", GAME.dragCurrent.y);
                line.setAttribute("stroke", "orange");
                line.setAttribute("stroke-width", "4");
                cutOverlay.appendChild(line);
            }

            // Draw Slices if Selecting
            if (GAME.isSelectingMode) {
                renderSlices();
            }
        }

        function renderSlices() {
            // Sort angles to form wedges
            // Each line creates 2 angles (a and a+PI)
            let angles = [];
            GAME.cutLines.forEach(a => {
                let norm = a % (2 * Math.PI);
                if (norm < 0) norm += 2 * Math.PI;
                angles.push(norm);
                angles.push((norm + Math.PI) % (2 * Math.PI));
            });
            angles.sort((a, b) => a - b);

            if (angles.length === 0) {
                // 1 slice (whole pizza)
                angles = [0, 2 * Math.PI];
            } else {
                // Close the loop
                angles.push(angles[0] + 2 * Math.PI);
            }

            // Create wedges
            const cx = 200, cy = 200, r = 190;
            for (let i = 0; i < angles.length - 1; i++) {
                const a1 = angles[i];
                const a2 = angles[i + 1];

                // SVG Path for arc
                const x1 = cx + r * Math.cos(a1);
                const y1 = cy + r * Math.sin(a1);
                const x2 = cx + r * Math.cos(a2);
                const y2 = cy + r * Math.sin(a2);

                const largeArc = (a2 - a1) > Math.PI ? 1 : 0;

                const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", "slice-wedge " + (GAME.selectedSlices.includes(i) ? "selected" : ""));

                // Click to toggle
                path.onmousedown = (e) => {
                    e.stopPropagation();
                    toggleSlice(i);
                };

                cutOverlay.appendChild(path);
            }
        }

        function toggleSlice(idx) {
            if (!GAME.isSelectingMode) return;
            const pos = GAME.selectedSlices.indexOf(idx);
            if (pos >= 0) GAME.selectedSlices.splice(pos, 1);
            else GAME.selectedSlices.push(idx);
            drawCutOverlay();
        }

        function resetCuts() {
            GAME.cutLines = [];
            GAME.selectedSlices = [];
            GAME.isSelectingMode = false;
            updateCuttingStateUI();
        }

        function finishCuttingMode() {
            GAME.isSelectingMode = true;
            updateCuttingStateUI();
        }

        function serveFinal() {
            if (!GAME.cuttingPizza) return;

            // Calculate Pieces count
            // Each line passing center adds 2 pieces? 
            // If they are unique angles. N lines = 2N pieces usually.
            const totalSlices = GAME.cutLines.length * 2 || 1;
            const selectedCount = GAME.selectedSlices.length;

            const reqDenom = GAME.cuttingPizza.order.reqDenom;
            const reqNum = GAME.cuttingPizza.order.reqNum;

            // Validation
            let desc = "";
            let score = 0;
            let good = true;

            // 1. Check Toppings
            const tType = GAME.cuttingPizza.order.targetType;
            const tCount = GAME.cuttingPizza.order.targetCount;
            const actCount = GAME.cuttingPizza.toppings.filter(t => t.type === tType).length;
            if (actCount != tCount) { desc += `❌ Toppingaantal fout (${actCount}/${tCount})<br>`; good = false; }

            // 2. Check Cuts (Denominator)
            if (totalSlices !== reqDenom) {
                desc += `❌ Verkeerd gesneden (${totalSlices} stukken ipv ${reqDenom})<br>`;
                good = false;
            } else {
                desc += `✅ Goed gesneden in ${totalSlices} stukken!<br>`;
            }

            // 3. Check Selection (Numerator)
            if (selectedCount !== reqNum) {
                desc += `❌ Verkeerd gekozen (${selectedCount} stukken ipv ${reqNum})<br>`;
                good = false;
            } else {
                desc += `✅ Goede portie gekozen (${selectedCount}/${totalSlices})<br>`;
            }

            // Scoring
            if (good) {
                const heat = GAME.cuttingPizza.heat;
                let bonus = 0;
                if (heat > 80) { bonus = 5; desc += "🔥 Lekker heet! (+5)"; }
                else if (heat < 30) { bonus = -2; desc += "🧊 Koud... (-2)"; }
                score = 25 + bonus;
                document.getElementById('res-title').textContent = "Excellent!";
                document.getElementById('res-score').style.color = "var(--success)";
            } else {
                score = 0;
                document.getElementById('res-title').textContent = "Helaas...";
                document.getElementById('res-score').style.color = "gray";
            }

            GAME.money += score;
            document.getElementById('score-display').textContent = GAME.money;

            // Feedback
            document.getElementById('res-desc').innerHTML = desc;
            document.getElementById('res-score').textContent = "+€" + score;
            document.getElementById('res-heat').style.width = GAME.cuttingPizza.heat + "%";
            document.getElementById('feedback-overlay').classList.add('visible');

            GAME.cuttingPizza = null;
        }

        function closeFeedback() {
            document.getElementById('feedback-overlay').classList.remove('visible');
            resetCuts();
            renderCutting();
            switchStation('prep');
            updateBadges(); // might still have pizzas
        }

        startNewOrder();

    </script>
</body>
