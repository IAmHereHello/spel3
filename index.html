<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Pythagoras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --success: #6BCB77;
            --danger: #FF6B6B;
            --pizza-crust: #E6A15C;
            --pizza-sauce: #D63031;
            --cheese: #FFEAA7;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            width: 100%;
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .stat-item {
            background: var(--light);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-icon { font-size: 1.5rem; }

        /* GAME AREA */
        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* CUSTOMER BUBBLE */
        #customer-area {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            height: 120px;
            align-items: flex-end;
            position: relative;
        }

        .customer-avatar {
            font-size: 4rem;
            margin-right: 1rem;
            animation: bounce 2s infinite ease-in-out;
        }

        .speech-bubble {
            background: white;
            padding: 1.5rem;
            border-radius: 20px 20px 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            position: relative;
            font-size: 1.2rem;
            line-height: 1.4;
        }

        .math-highlight {
            color: var(--primary);
            font-weight: 900;
            font-size: 1.4rem;
            background: #fff0f0;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        /* PIZZA BOARD */
        #pizza-board {
            position: relative;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            cursor: crosshair;
            transition: transform 0.3s ease;
        }
        
        #pizza-board:active {
            transform: scale(0.98);
        }

        .pizza-base {
            width: 360px;
            height: 360px;
            background: var(--pizza-crust);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            border: 8px solid #d48d48;
        }

        .sauce-layer {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            background: var(--pizza-sauce);
            border-radius: 50%;
            opacity: 0.9;
        }

        .cheese-layer {
            position: absolute;
            top: 30px; left: 30px; right: 30px; bottom: 30px;
            background: var(--cheese);
            border-radius: 50%;
            opacity: 0.8;
            background-image: radial-gradient(#ffd56b 10%, transparent 11%);
            background-size: 20px 20px;
        }

        .topping {
            position: absolute;
            width: 32px;
            height: 32px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* INGREDIENT SELECTOR */
        #controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            background: white;
            padding: 1rem;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .ingredient-btn {
            background: #f0f0f0;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .ingredient-btn.active {
            background: #fff0f0;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .ingredient-btn:hover {
            background: #e8e8e8;
        }

        .ingredient-icon {
            font-size: 1.5rem;
        }

        #serve-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-left: 1rem;
            transition: transform 0.2s;
            box-shadow: 0 4px 0 #58a962;
        }

        #serve-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* OVERLAYS */
        #feedback-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #feedback-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .feedback-card {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 400px;
        }

        #feedback-overlay.visible .feedback-card {
            transform: scale(1);
        }

        .feedback-emoji { font-size: 4rem; display: block; margin-bottom: 1rem; }
        .feedback-title { font-size: 2rem; font-weight: 900; margin: 0 0 1rem 0; color: var(--dark); }
        .feedback-text { color: #666; margin-bottom: 2rem; font-size: 1.1rem; }
        
        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            transition: transform 0.2s;
        }

        .btn-next:hover { transform: scale(1.05); }

        /* ANIMATIONS */
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .wiggle { animation: wiggle 0.5s ease-in-out; }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:900; font-size:1.5rem; color:var(--primary);">🍕 Pizza Pythagoras</div>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-icon">📅</span>
                <span>Dag <span id="day-display">1</span></span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">💰</span>
                <span>€ <span id="score-display">0</span></span>
            </div>
        </div>
    </header>

    <div id="game-container">
        <div id="customer-area">
            <div class="customer-avatar" id="customer-face">👨‍🍳</div>
            <div class="speech-bubble" id="order-text">
                Welkom chef! Klik op "Start" om te beginnen.
            </div>
        </div>

        <div id="pizza-board">
            <div class="pizza-base" id="pizza-base">
                <div class="sauce-layer"></div>
                <div class="cheese-layer"></div>
                <!-- Toppings go here -->
            </div>
        </div>

        <div id="controls">
            <button class="ingredient-btn active" onclick="selectTool('salami')">
                <span class="ingredient-icon">🍕</span>
                <span>Salami</span>
            </button>
            <button class="ingredient-btn" onclick="selectTool('olive')">
                <span class="ingredient-icon">🫒</span>
                <span>Olijven</span>
            </button>
            <button class="ingredient-btn" onclick="selectTool('mushroom')">
                <span class="ingredient-icon">🍄</span>
                <span>Champignons</span>
            </button>
            <button id="serve-btn" onclick="servePizza()">Bakken & Serveren!</button>
        </div>
    </div>

    <!-- FEEDBACK OVERLAY -->
    <div id="feedback-overlay">
        <div class="feedback-card">
            <span class="feedback-emoji" id="fb-emoji">🤩</span>
            <h2 class="feedback-title" id="fb-title">Perfect!</h2>
            <p class="feedback-text" id="fb-text">Je hebt precies 12 salami gelegd.</p>
            <button class="btn-next" onclick="nextOrder()">Volgende Klant ➔</button>
        </div>
    </div>

    <script>
        // STATE
        let state = {
            day: 1,
            score: 0,
            activeTool: 'salami',
            currentOrder: null,
            toppingsPlaced: {
                salami: 0,
                olive: 0,
                mushroom: 0
            },
            isInteractable: false
        };

        const INGREDIENTS = {
            salami: { icon: '🍕', name: 'Salami' },
            olive: { icon: '🫒', name: 'Olijven' },
            mushroom: { icon: '🍄', name: 'Champignons' }
        };

        const CUSTOMERS = ['👩', '👨', '👵', '👴', '👧', '👦', '🦁', '👽'];

        // DOM ELEMENTS
        const pizzaBase = document.getElementById('pizza-base');
        const orderText = document.getElementById('order-text');
        const customerFace = document.getElementById('customer-face');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        
        // INIT
        function init() {
            startDay();
        }

        function startDay() {
            nextOrder();
        }

        function selectTool(tool) {
            state.activeTool = tool;
            // Update UI
            document.querySelectorAll('.ingredient-btn').forEach(btn => btn.classList.remove('active'));
            // Find button roughly (in real code use IDs, but this is simple enough)
            const btns = document.querySelectorAll('.ingredient-btn');
            if(tool === 'salami') btns[0].classList.add('active');
            if(tool === 'olive') btns[1].classList.add('active');
            if(tool === 'mushroom') btns[2].classList.add('active');
        }

        // MATH GENERATOR
        function generateOrder() {
            const types = Object.keys(INGREDIENTS);
            const type = types[Math.floor(Math.random() * types.length)];
            
            // Difficulty based on "Day" - simplified for MVP
            // Level 1: Addition (A + B)
            // Level 2: Multiplication (A x B)
            let operation = (state.day > 1 && Math.random() > 0.5) ? 'mult' : 'add';
            
            let num1, num2, target, text;

            if (operation === 'add') {
                target = Math.floor(Math.random() * 8) + 3; // 3 to 10
                num1 = Math.floor(Math.random() * (target - 1)) + 1;
                num2 = target - num1;
                text = `Doe mij een pizza met <span class="math-highlight">${num1} + ${num2}</span> plakjes ${INGREDIENTS[type].name}!`;
            } else {
                num1 = Math.floor(Math.random() * 3) + 2; // 2 to 4
                num2 = Math.floor(Math.random() * 3) + 2; // 2 to 4
                target = num1 * num2;
                text = `Ik rammel! Mag ik <span class="math-highlight">${num1} x ${num2}</span> stukjes ${INGREDIENTS[type].name}?`;
            }

            return {
                type: type,
                target: target,
                text: text
            };
        }

        function nextOrder() {
            // Reset Board
            pizzaBase.innerHTML = '<div class="sauce-layer"></div><div class="cheese-layer"></div>';
            state.toppingsPlaced = { salami: 0, olive: 0, mushroom: 0 };
            
            // Hide Feedback
            feedbackOverlay.classList.remove('visible');

            // Generate New Order
            state.currentOrder = generateOrder();
            state.isInteractable = true;

            // Visuals
            customerFace.textContent = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
            customerFace.style.animation = 'none';
            customerFace.offsetHeight; /* trigger reflow */
            customerFace.style.animation = 'bounce 2s infinite ease-in-out';
            
            orderText.innerHTML = state.currentOrder.text;
        }

        // INTERACTION
        pizzaBase.addEventListener('mousedown', (e) => {
            if (!state.isInteractable) return;

            const rect = pizzaBase.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Simple boundary check (circle)
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const dist = Math.sqrt((x-centerX)**2 + (y-centerY)**2);

            if (dist < rect.width / 2 - 20) {
                addTopping(x, y);
            }
        });

        function addTopping(x, y) {
            const tool = state.activeTool;
            state.toppingsPlaced[tool]++;

            const el = document.createElement('div');
            el.className = 'topping';
            el.textContent = INGREDIENTS[tool].icon;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            // Random rotation for natural look
            el.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg) scale(0)`;
            
            // CSS Animation override handled by keyframes, but let's set final state
            setTimeout(() => {
                el.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg) scale(1)`;
            }, 300);

            pizzaBase.appendChild(el);
            
            // Optional: Sound effect could go here
        }

        function servePizza() {
            if (!state.isInteractable) return;
            state.isInteractable = false;

            const order = state.currentOrder;
            const placed = state.toppingsPlaced[order.type];
            const others = Object.keys(state.toppingsPlaced).reduce((sum, key) => 
                key !== order.type ? sum + state.toppingsPlaced[key] : sum, 0);

            let isCorrect = (placed === order.target) && (others === 0);

            showFeedback(isCorrect, placed, order.target, others);
        }

        function showFeedback(success, placed, target, others) {
            const title = document.getElementById('fb-title');
            const text = document.getElementById('fb-text');
            const emoji = document.getElementById('fb-emoji');

            if (success) {
                // Reward
                state.score += 10;
                document.getElementById('score-display').textContent = state.score;
                state.day = Math.floor(state.score / 50) + 1;
                document.getElementById('day-display').textContent = state.day;

                emoji.textContent = '😋';
                title.textContent = 'Heerlijk!';
                title.style.color = 'var(--success)';
                text.textContent = `Precies ${target} stukjes! Dat smaakt naar meer.`;
            } else {
                emoji.textContent = '😤';
                title.textContent = 'Dat klopt niet...';
                title.style.color = 'var(--danger)';
                
                if (others > 0) {
                   text.textContent = `Ik wilde alleen ${INGREDIENTS[state.currentOrder.type].name}, geen rommel!`; 
                } else if (placed < target) {
                    text.textContent = `Ik tel er maar ${placed}, maar ik wilde er ${target}!`;
                } else {
                    text.textContent = `Véél te veel! Ik tel er ${placed}, dat moesten er ${target} zijn.`;
                }
            }

            feedbackOverlay.classList.add('visible');
        }

        // Initial Start
        init();

    </script>
</body>
</html>
