<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Math: The Calculator</title>
    <style>
        body {
            margin: 0;
            background-color: #1a0b2e;
            /* Dark Purple */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            overflow: hidden;
            /* No scroll */
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            /* Limit width for vertical layout */
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 1. CANVAS (Top) */
        canvas {
            background: #0f0518;
            border: 4px solid #9b59b6;
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.3);
            border-radius: 8px;
            width: 100%;
            flex-grow: 1;
            /* Fill available space */
            max-height: 65vh;
            /* Leave room for controls */
            display: block;
        }

        /* 2. CONTROLS (Bottom) */
        #controls-wrapper {
            width: 100%;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Ammo Buttons Row */
        #ammo-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .ammo-btn {
            flex: 1;
            height: 70px;
            /* Big hit area */
            background: #2e1a47;
            border: 2px solid #5b2c6f;
            border-radius: 8px;
            color: #d2b4de;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .ammo-btn.active {
            background: #9b59b6;
            color: white;
            border-color: white;
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.5);
            transform: translateY(-2px);
        }

        /* Movement Controls Row (Touch) */
        #touch-moves {
            display: flex;
            justify-content: center;
            /* Center the movement keys */
            gap: 20px;
            width: 100%;
        }

        .move-btn {
            width: 80px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
        }

        .fire-btn {
            width: 100px;
            height: 60px;
            background: rgba(241, 196, 15, 0.2);
            border: 2px solid #f1c40f;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
        }

        .move-btn:active,
        .fire-btn:active {
            opacity: 0.7;
            transform: scale(0.95);
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(25, 10, 40, 0.98);
            padding: 30px;
            border: 2px solid #9b59b6;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            z-index: 100;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }

        h1 {
            color: #d2b4de;
            margin-top: 0;
        }

        input {
            width: 90%;
            padding: 12px;
            background: #1a0b2e;
            border: 1px solid #5b2c6f;
            color: white;
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
        }

        button.ui-btn {
            width: 100%;
            padding: 12px;
            background: #9b59b6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .final-msg {
            font-size: 20px;
            color: #f1c40f;
            padding: 20px;
            border: 2px dashed #f1c40f;
            margin: 20px 0;
            background: rgba(241, 196, 15, 0.1);
        }
    </style>
</head>

<body>

    <div id="game-container">
        <!-- Canvas Area -->
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Controls Area -->
        <div id="controls-wrapper">
            <!-- 1. Ammo Selectors -->
            <div id="ammo-controls">
                <div class="ammo-btn active" id="btn-30" onclick="selectAmmo(0)">30°</div>
                <div class="ammo-btn" id="btn-60" onclick="selectAmmo(1)">60°</div>
                <div class="ammo-btn" id="btn-90" onclick="selectAmmo(2)">90°</div>
            </div>

            <!-- 2. Movement / Fire -->
            <div id="touch-moves">
                <div class="move-btn" id="btn-left">⬅️</div>
                <div class="fire-btn" id="btn-shoot">FIRE</div>
                <div class="move-btn" id="btn-right">➡️</div>
            </div>
        </div>
    </div>

    <!-- SCREENS -->
    <div id="screen-login" class="overlay">
        <h1>CALCULATOR</h1>
        <p>Voer toegangscode in:</p>
        <input type="password" id="inp-code" placeholder="Code">
        <input type="text" id="inp-name" placeholder="Naam">
        <button class="ui-btn" onclick="submitLogin()">START</button>
    </div>

    <div id="screen-gameover" class="overlay hidden" style="border-color: #ff4757;">
        <h1 style="color: #ff4757">MISSIE MISLUKT</h1>
        <p>Score: <span id="score-loss">0</span></p>
        <button class="ui-btn" style="background:#ff4757" onclick="location.reload()">RETRY</button>
    </div>

    <div id="screen-win" class="overlay hidden" style="border-color: #f1c40f;">
        <h1 style="color: #f1c40f">GEFELICITEERD!</h1>
        <div class="final-msg">
            Je bent GESLAAGD voor<br>
            Games in de Klas!
        </div>
        <p>Score: <span id="score-win">0</span></p>
    </div>

    <script>
        /* ---------------- CONFIG ---------------- */
        const LOG_URL = "https://script.google.com/macros/s/AKfycbytukuFv4uakCSohLYXZa-44gzMv_0jWAAQoBfLXHaMTN_TsRYK0lcVaeKhkXtbdek7XA/exec";
        const TARGET_SCORE = 250;
        const BASE_SPAWN_INTERVAL = 2000;

        const AMMO = [
            { val: 30, color: "#3498db" },
            { val: 60, color: "#e74c3c" },
            { val: 90, color: "#f1c40f" }
        ];

        /* ---------------- STATE ---------------- */
        let playerName = "";
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let lastTime = 0;
        let spawnTimer = 0;
        let selectedAmmo = 0;

        let player = { x: 275, y: 530, w: 50, h: 50 }; // Center based on 600 width
        let bullets = [];
        let enemies = [];
        let stars = [];

        /* ---------------- INIT ---------------- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive Canvas Scaling
        function resizeCanvas() {
            // Keep internal resolution fixed, scale via CSS
            // but we use 600x600 logical size for simplicity
            // Logic below handles varying aspect ratios if needed, 
            // but fixed logical size is safer for game mechanics.
        }

        // Init Stars
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * 600,
                y: Math.random() * 600,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        /* ---------------- CONTROLS ---------------- */
        const keys = { Left: false, Right: false };

        window.addEventListener('keydown', e => {
            if (e.code === 'ArrowLeft') keys.Left = true;
            if (e.code === 'ArrowRight') keys.Right = true;
            if (e.code === 'Space' && gameRunning) fireBullet();
            if (e.key === '1') selectAmmo(0);
            if (e.key === '2') selectAmmo(1);
            if (e.key === '3') selectAmmo(2);
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft') keys.Left = false;
            if (e.code === 'ArrowRight') keys.Right = false;
        });

        // Touch Helpers
        function bindTouch(id, startFn, endFn) {
            const el = document.getElementById(id);
            const handleStart = (e) => { e.preventDefault(); startFn(); };
            const handleEnd = (e) => { e.preventDefault(); endFn(); };
            el.addEventListener('mousedown', handleStart);
            el.addEventListener('mouseup', handleEnd);
            el.addEventListener('touchstart', handleStart);
            el.addEventListener('touchend', handleEnd);
            el.addEventListener('mouseleave', handleEnd);
        }

        bindTouch('btn-left', () => keys.Left = true, () => keys.Left = false);
        bindTouch('btn-right', () => keys.Right = true, () => keys.Right = false);
        bindTouch('btn-shoot', () => fireBullet(), () => { });

        function selectAmmo(idx) {
            selectedAmmo = idx;
            // Update UI indices
            document.querySelectorAll('.ammo-btn').forEach((b, i) => {
                if (i === idx) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        /* ---------------- GAMEPLAY ---------------- */
        function submitLogin() {
            const c = document.getElementById('inp-code').value.trim().toUpperCase();
            const n = document.getElementById('inp-name').value.trim();
            if (c !== "PYTHAGORAS") return alert("Code onjuist!");
            if (!n) return alert("Naam verplicht!");

            playerName = n;
            document.getElementById('screen-login').classList.add('hidden');
            startGame();
        }

        function startGame() {
            score = 0;
            lives = 3;
            player.x = 275; // mid
            bullets = [];
            enemies = [];
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function fireBullet() {
            bullets.push({
                x: player.x + 25,
                y: player.y,
                val: AMMO[selectedAmmo].val,
                color: AMMO[selectedAmmo].color
            });
        }

        function gameLoop(curr) {
            if (!gameRunning) return;
            const dt = curr - lastTime;
            lastTime = curr;
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // Player
            if (keys.Left) player.x -= 0.4 * dt;
            if (keys.Right) player.x += 0.4 * dt;
            if (player.x < 0) player.x = 0;
            if (player.x > 550) player.x = 550; // 600 - 50

            // Bullets
            for (let i = 0; i < bullets.length; i++) {
                bullets[i].y -= 0.8 * dt;
                if (bullets[i].y < -50) {
                    bullets.splice(i, 1); i--;
                }
            }

            // Spawn
            let interval = Math.max(800, BASE_SPAWN_INTERVAL - score * 6);
            spawnTimer += dt;
            if (spawnTimer > interval) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // Enemies
            for (let i = 0; i < enemies.length; i++) {
                let e = enemies[i];
                e.y += e.speed * (dt / 16);

                // Collision
                const hitDist = 45;
                let hit = false;
                for (let b = 0; b < bullets.length; b++) {
                    const bx = bullets[b].x;
                    const by = bullets[b].y;
                    // Distance check
                    if (Math.hypot(bx - e.x, by - (e.y + 30)) < hitDist) {
                        if (bullets[b].val === e.target) {
                            // Good
                            score += 10;
                            enemies.splice(i, 1); i--;
                            bullets.splice(b, 1); b--;
                            if (score >= TARGET_SCORE) doWin();
                            hit = true;
                        } else {
                            // Bad
                            score -= 5;
                            if (score < 0) score = 0;
                            bullets.splice(b, 1); b--;
                            hit = true;
                        }
                        break;
                    }
                }
                if (hit) continue;

                if (e.y > 600) {
                    lives--;
                    enemies.splice(i, 1); i--;
                    if (lives <= 0) doGameOver();
                }
            }

            // Stars
            stars.forEach(s => {
                s.y += s.speed * (dt / 16);
                if (s.y > 600) { s.y = 0; s.x = Math.random() * 600; }
            });
        }

        function spawnEnemy() {
            // Logic: Target is 30, 60, or 90
            const targets = [30, 60, 90];
            const target = targets[Math.floor(Math.random() * 3)];

            const remainder = 180 - target; // e.g. 150, 120, 90

            // Random multiple of 10 for Angle A
            // min = 10, max = remainder - 10
            // range = (max - min) / 10
            const min = 10;
            const max = remainder - 10;
            const steps = (max - min) / 10;

            const step = Math.floor(Math.random() * (steps + 1));
            const angleA = min + (step * 10);
            const angleB = remainder - angleA;

            const speed = 0.5 + (score / 500);

            enemies.push({
                x: 50 + Math.random() * 500,
                y: -60,
                target: target,
                label: `${angleA}°, ${angleB}°`,
                speed: speed
            });
        }

        /* ---------------- DRAW ---------------- */
        function draw() {
            // Clear
            ctx.fillStyle = "#1a0b2e"; // Match body bg (seamless)
            // But canvas has its own dark bg color in CSS, let's match that:
            ctx.fillStyle = "#0f0518";
            ctx.fillRect(0, 0, 600, 600);

            // Stars
            ctx.fillStyle = "white";
            ctx.globalAlpha = 0.5;
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
            ctx.globalAlpha = 1;

            // Enemies
            enemies.forEach(e => {
                // Triangle Shape
                ctx.fillStyle = "rgba(155, 89, 182, 0.2)";
                ctx.strokeStyle = "#9b59b6";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(e.x, e.y);
                ctx.lineTo(e.x - 35, e.y + 60);
                ctx.lineTo(e.x + 35, e.y + 60);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Text
                ctx.fillStyle = "white";
                ctx.font = "bold 24px Arial"; // Bigger
                ctx.textAlign = "center";
                ctx.fillText(e.label, e.x, e.y + 100);
            });

            // Player
            const pc = AMMO[selectedAmmo].color;
            ctx.fillStyle = pc;
            ctx.shadowColor = pc;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(player.x + 25, player.y);
            ctx.lineTo(player.x + 50, player.y + 50);
            ctx.lineTo(player.x + 25, player.y + 40);
            ctx.lineTo(player.x, player.y + 50);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Bullets
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.fillText(b.val, b.x, b.y);
            });

            // Score HUD (On Canvas)
            ctx.fillStyle = "white";
            ctx.font = "bold 20px Segoe UI";
            ctx.textAlign = "left";
            ctx.fillText(`SCORE: ${score}`, 20, 40);
            ctx.textAlign = "right";
            ctx.fillText("❤️".repeat(lives), 580, 40);
        }

        /* ---------------- LOG ---------------- */
        function doWin() {
            gameRunning = false;
            document.getElementById('score-win').innerText = score;
            logData(score);
            document.getElementById('screen-win').classList.remove('hidden');
        }
        function doGameOver() {
            gameRunning = false;
            document.getElementById('score-loss').innerText = score;
            logData(score);
            document.getElementById('screen-gameover').classList.remove('hidden');
        }
        function logData(s) {
            const url = `${LOG_URL}?action=submit&code=${encodeURIComponent(playerName)}&quizId=Game3_Calc&score=${s}&total=${TARGET_SCORE}`;
            fetch(url, { mode: 'no-cors' }).catch(console.error);
        }
    </script>
</body>

</html>
