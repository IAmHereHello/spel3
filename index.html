<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Pythagoras - De Pizzeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --success: #6BCB77;
            --danger: #FF6B6B;
            --pizza-crust: #E6A15C;
            --pizza-sauce: #D63031;
            --cheese: #FFEAA7;
            --metal: #95a5a6;
            --wood: #8e44ad;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #333;
            /* Chequered floor pattern */
            background-image:
                linear-gradient(45deg, #222 25%, transparent 25%),
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            color: var(--dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            width: 100%;
            background: white;
            padding: 0.8rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            height: 70px;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .stat-item {
            background: var(--light);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #eee;
        }

        /* NAVIGATION TABS */
        #nav-tabs {
            width: 100%;
            height: 80px;
            background: #2C3E50;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.3);
            z-index: 20;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            padding: 0.5rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
            position: relative;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .nav-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: var(--dark);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .badge.visible {
            opacity: 1;
        }

        /* VIEW CONTAINER */
        #main-view {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: #dcdde1;
        }

        .station {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .station.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ================== STATION 1: PREP (Toppings) ================== */
        #station-prep {
            background: #dcdde1;
            /* Stainless Steel */
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 50px 100%;
            justify-content: flex-start;
        }

        #ticket-rail {
            width: 100%;
            min-height: 100px;
            background: #555;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .ticket {
            background: #fff;
            width: 400px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            /* transform: rotate(-1deg); */
            position: relative;
            text-align: center;
        }

        .ticket.empty {
            opacity: 0.5;
            border: 2px dashed #999;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .ticket.empty:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #prep-table {
            position: relative;
            width: 100%;
            max-width: 900px;
            flex: 1;
            display: flex;
            gap: 2rem;
            align-items: center;
            justify-content: center;
        }

        #ingredients-rack {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .ingredient-bin {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            border: 4px solid #bdc3c7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .ingredient-bin:hover {
            transform: scale(1.05);
        }

        .ingredient-bin.active {
            border-color: var(--success);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }

        .bin-label {
            position: absolute;
            bottom: -20px;
            font-size: 0.8rem;
            background: #333;
            color: white;
            padding: 2px 5px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
        }

        .ingredient-bin:hover .bin-label {
            opacity: 1;
        }

        #prep-board {
            width: 450px;
            height: 450px;
            background: #deb887;
            border-radius: 12px;
            border: 8px solid #8b4513;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .pizza-visual {
            width: 380px;
            height: 380px;
            background: var(--pizza-crust);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
            border: 6px solid #d38c45;
            transition: transform 0.2s;
        }

        .pizza-visual .sauce {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: var(--pizza-sauce);
            border-radius: 50%;
        }

        .topping-item {
            position: absolute;
            width: 36px;
            height: 36px;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            /* transform handled in JS */
        }

        #prep-controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #58a962;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .action-btn:disabled {
            background: #95a5a6;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ================== STATION 2: OVEN ================== */
        #station-oven {
            background: #5D4037;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 2rem;
            padding: 4rem;
        }

        .oven-slot {
            width: 300px;
            height: 220px;
            background: #3E2723;
            border-radius: 20px 20px 0 0;
            border: 4px solid #8D6E63;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .oven-fire {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to top, #ff5722, transparent);
            opacity: 0.3;
            animation: flicker 0.2s infinite;
        }

        .oven-timer {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 1.2rem;
        }

        .oven-temp-gauge {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 10px;
            height: 40px;
            background: #333;
            border: 1px solid #666;
            border-radius: 4px;
            overflow: hidden;
        }

        .oven-temp-fill {
            width: 100%;
            height: 0%;
            background: red;
            position: absolute;
            bottom: 0;
            transition: height 0.5s;
        }

        /* Pizza in oven is smaller */
        .oven-pizza {
            width: 200px;
            height: 200px;
            transform: scaleX(1) scaleY(0.4);
            /* Perspective flatten */
            cursor: pointer;
            transition: transform 0.2s, filter 0.5s;
        }

        .oven-pizza:hover {
            transform: scaleX(1.05) scaleY(0.42);
        }

        .oven-pizza.raw {
            filter: brightness(1);
        }

        .oven-pizza.baking {
            filter: brightness(0.9);
        }

        .oven-pizza.done {
            filter: brightness(0.7) sepia(0.4);
            border-color: #8D6E63;
        }

        .oven-pizza.burnt {
            filter: grayscale(1) brightness(0.3);
        }

        /* ================== STATION 3: CUTTING ================== */
        #station-cutting {
            background: #7f8c8d;
            /* Stone surface */
            justify-content: center;
        }

        #cutting-board-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        #cutting-tools {
            display: flex;
            gap: 1rem;
        }

        .cut-btn {
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .cut-btn:hover {
            background: white;
            border-color: var(--secondary);
        }

        .cut-icon {
            width: 40px;
            height: 40px;
            border: 2px solid #333;
            border-radius: 50%;
            margin-bottom: 5px;
            position: relative;
        }

        /* CSS Shapes for cut icons */
        .cut-2::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #333;
        }

        .cut-4::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #333;
        }

        .cut-4::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background: #333;
        }

        .cut-6::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #333;
        }

        /* Simplified 6/8 for icon */

        .fraction-text {
            font-size: 1.2rem;
            color: var(--dark);
        }

        #cut-canvas-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #final-serve-btn {
            background: var(--accent);
            color: var(--dark);
            padding: 1rem 3rem;
            font-size: 1.5rem;
            border-radius: 50px;
            border: none;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(255, 230, 109, 0.4);
            cursor: pointer;
            margin-top: 2rem;
        }

        #final-serve-btn:hover {
            transform: scale(1.05);
        }


        /* ANIMATIONS & OVERLAYS */
        @keyframes flicker {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.5;
            }
        }

        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #feedback-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .feedback-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        #feedback-overlay.visible .feedback-card {
            transform: scale(1);
        }

        .heat-meter {
            width: 100%;
            height: 10px;
            background: #eee;
            margin: 10px 0;
            border-radius: 5px;
            overflow: hidden;
        }

        .heat-val {
            height: 100%;
            background: red;
            width: 80%;
        }
    </style>
</head>

<body>

    <header>
        <div style="font-weight:900; font-size:1.6rem; color:var(--dark);">🍕 Pizza Pythagoras</div>
        <div class="stats">
            <div class="stat-item"><span>📅 Dag <span id="day-display">1</span></span></div>
            <div class="stat-item"><span>💰 € <span id="score-display">0</span></span></div>
        </div>
    </header>

    <div id="main-view">

        <!-- STATION 1: PREP -->
        <div id="station-prep" class="station active">
            <div id="ticket-rail">
                <div id="active-ticket-area">
                    <!-- Ticket injected here -->
                    <div class="ticket empty" onclick="startNewOrder()">
                        <span style="font-size:2rem; font-weight:bold; color:#777;">+ NIEUWE BESTELLING</span>
                    </div>
                </div>
            </div>

            <div id="prep-table">
                <div id="ingredients-rack">
                    <div class="ingredient-bin" onclick="setTool('salami')" id="bin-salami"><span
                            style="pointer-events:none">🍕</span>
                        <div class="bin-label">Salami</div>
                    </div>
                    <div class="ingredient-bin" onclick="setTool('olive')" id="bin-olive"><span
                            style="pointer-events:none">🫒</span>
                        <div class="bin-label">Olijf</div>
                    </div>
                    <div class="ingredient-bin" onclick="setTool('mushroom')" id="bin-mushroom"><span
                            style="pointer-events:none">🍄</span>
                        <div class="bin-label">Paddenst.</div>
                    </div>
                </div>

                <div id="prep-board">
                    <div style="color:#888; position:absolute; top:-30px;">Klik om te beleggen</div>
                    <div class="pizza-visual" id="prep-pizza" onmousedown="handlePrepClick(event)">
                        <div class="sauce"></div>
                        <div id="prep-toppings-container"></div>
                    </div>
                </div>

                <div id="prep-controls">
                    <button class="action-btn" id="btn-to-oven" onclick="movePrepToOven()" disabled>Naar de Oven
                        ➡</button>
                    <button class="action-btn" style="background:#e74c3c" onclick="trashPrep()">🗑 Prullenbak</button>
                </div>
            </div>
        </div>

        <!-- STATION 2: OVEN -->
        <div id="station-oven" class="station">
            <!-- 4 Oven Slots -->
            <div class="oven-slot" id="slot-0"></div>
            <div class="oven-slot" id="slot-1"></div>
            <div class="oven-slot" id="slot-2"></div>
            <div class="oven-slot" id="slot-3"></div>
        </div>

        <!-- STATION 3: CUTTING -->
        <div id="station-cutting" class="station">
            <div id="cutting-board-area" style="display:none;">
                <h2 style="color:white; text-shadow:0 2px 4px rgba(0,0,0,0.5);">Snijden & Serveren</h2>
                <div class="ticket" id="cut-ticket-display" style="width:300px; margin-bottom:1rem;"></div>

                <div id="cut-canvas-container">
                    <div class="pizza-visual cooked" id="cut-pizza-visual">
                        <div class="sauce"></div>
                        <div id="cut-toppings-container"></div>
                    </div>
                    <!-- Overlay for cuts -->
                    <svg id="cut-overlay"
                        style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></svg>
                </div>

                <div id="cutting-tools">
                    <button class="cut-btn" onclick="applyCut(2)">
                        <div class="cut-icon cut-2"></div>
                        <span class="fraction-text">1/2</span>
                    </button>
                    <button class="cut-btn" onclick="applyCut(4)">
                        <div class="cut-icon cut-4"></div>
                        <span class="fraction-text">1/4</span>
                    </button>
                    <button class="cut-btn" onclick="applyCut(6)">
                        <div class="cut-icon cut-6"></div>
                        <span class="fraction-text">1/6</span>
                    </button>
                    <button class="cut-btn" onclick="applyCut(8)">
                        <div class="cut-icon"
                            style="background: repeating-conic-gradient(#333 0 2deg, transparent 2deg 45deg);"></div>
                        <span class="fraction-text">1/8</span>
                    </button>
                </div>

                <button id="final-serve-btn" onclick="serveFinal()">🔔 Serveren!</button>
            </div>
            <div id="cutting-empty-msg" style="color:white; font-size:1.5rem; opacity:0.6;">
                Selecteer een pizza uit de Oven om te snijden.
            </div>
        </div>

    </div>

    <!-- TABS -->
    <div id="nav-tabs">
        <button class="nav-btn active" onclick="switchStation('prep')">
            <span class="nav-icon">🥣</span>
            Toppings
        </button>
        <button class="nav-btn" onclick="switchStation('oven')">
            <span class="nav-icon">🔥</span>
            Oven
            <div class="badge" id="badge-oven">0</div>
        </button>
        <button class="nav-btn" onclick="switchStation('cutting')">
            <span class="nav-icon">🔪</span>
            Snijden
            <div class="badge" id="badge-cut">0</div>
        </button>
    </div>

    <!-- FEEDBACK -->
    <div id="feedback-overlay">
        <div class="feedback-card">
            <h2 id="res-title">Resultaat</h2>
            <div class="heat-meter">
                <div class="heat-val" id="res-heat"></div>
            </div>
            <p id="res-desc">Details...</p>
            <h1 id="res-score" style="font-size:3rem; color:var(--primary);">+€15</h1>
            <button class="action-btn" onclick="closeFeedback()">Doorgaan</button>
        </div>
    </div>


    <script>
        // ================= GAME LOGIC =================
        const GAME = {
            day: 1,
            money: 0,
            activeStation: 'prep',

            // Current Prep State
            prepOrder: null, // The ticket currently on prep table
            prepToppings: [], // Array of {type, x, y}
            activeTool: null,

            // Oven State
            ovenSlots: [null, null, null, null], // Array of Pizza Objects

            // Cutting State
            cuttingPizza: null, // The pizza currently on cutting board
            selectedCuts: 0    // How many pieces
        };

        const INGREDIENTS = {
            salami: { icon: '🍕', name: 'Salami' },
            olive: { icon: '🫒', name: 'Olijven' },
            mushroom: { icon: '🍄', name: 'Champignons' }
        };

        // --- CORE LOOPS ---
        setInterval(() => {
            updateOven();
        }, 100);

        function updateOven() {
            GAME.ovenSlots.forEach((pizza, idx) => {
                if (!pizza) return;

                if (pizza.state === 'BAKING') {
                    pizza.bakeTime += 0.1; // 100ms
                    // Done baking after 30 sec? Let's do 10s for testing speed, user asked 30s though.
                    // 30 seconds is quite long for a game tick, let's stick to 15s for gameplay flow, 
                    // but display it as a "timer".
                    const BAKE_DURATION = 15.0;

                    if (pizza.bakeTime >= BAKE_DURATION) {
                        pizza.state = 'BAKED';
                        pizza.heat = 100; // Starting heat
                        updateOvenVisual(idx);
                        // Notify badge
                        updateBadges();
                    }
                    updateOvenTimer(idx, BAKE_DURATION - pizza.bakeTime);
                } else if (pizza.state === 'BAKED') {
                    // Heat decay
                    pizza.heat -= 0.2; // roughly 50 seconds to hit 0 heat
                    if (pizza.heat < 0) pizza.heat = 0;
                    updateOvenHeat(idx, pizza.heat);
                }
            });
        }

        // --- STATIONS ---
        function switchStation(stationName) {
            // Hide all
            document.querySelectorAll('.station').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            // Show one
            document.getElementById('station-' + stationName).classList.add('active');
            GAME.activeStation = stationName;

            // Highlight tab
            const tabIdx = ['prep', 'oven', 'cutting'].indexOf(stationName);
            document.querySelectorAll('.nav-btn')[tabIdx].classList.add('active');

            if (stationName === 'oven') renderOven();
            if (stationName === 'cutting') renderCutting();
        }

        function updateBadges() {
            // Oven badge: count READY pizzas
            const readyCount = GAME.ovenSlots.filter(p => p && p.state === 'BAKED').length;
            const bOven = document.getElementById('badge-oven');
            bOven.textContent = readyCount;
            bOven.classList.toggle('visible', readyCount > 0);

            // We could also badge cutting if there is a pizza waiting there? 
            // Currently cutting has 1 active slot.
        }

        // --- PREP STATION LOGIC ---
        function startNewOrder() {
            if (GAME.prepOrder) return; // Already have one

            // Generate Math Logic
            const types = Object.keys(INGREDIENTS);
            const type = types[Math.floor(Math.random() * types.length)];
            const isAdd = Math.random() > 0.5;
            let n1, n2, target, txt;

            if (isAdd) {
                target = Math.floor(Math.random() * 8) + 4; // 4..11
                n1 = Math.floor(Math.random() * (target - 1)) + 1;
                n2 = target - n1;
                txt = `Bestelling: <b style="color:#d35400">${n1} + ${n2}</b> x ${INGREDIENTS[type].name}`;
            } else {
                n1 = Math.floor(Math.random() * 3) + 2;
                n2 = Math.floor(Math.random() * 3) + 2;
                target = n1 * n2;
                txt = `Bestelling: <b style="color:#d35400">${n1} x ${n2}</b> x ${INGREDIENTS[type].name}`;
            }

            // Fraction logic for cutting later
            const denominators = [2, 4, 6, 8];
            const cuts = denominators[Math.floor(Math.random() * denominators.length)];
            txt += `<br>Snij in <b>1/${cuts}e</b> stukken.`;

            GAME.prepOrder = {
                id: Date.now(),
                text: txt,
                targetType: type,
                targetCount: target,
                targetCuts: cuts
            };
            GAME.prepToppings = [];
            GAME.activeTool = null;

            renderPrepTicket();
            clearPrepPizza();
            document.getElementById('btn-to-oven').disabled = false;
        }

        function renderPrepTicket() {
            const area = document.getElementById('active-ticket-area');
            if (!GAME.prepOrder) {
                area.innerHTML = '<div class="ticket empty" onclick="startNewOrder()"><span style="font-size:2rem; font-weight:bold; color:#777;">+ NIEUWE BESTELLING</span></div>';
            } else {
                area.innerHTML = `<div class="ticket"><div style="font-size:1.2rem; line-height:1.5;">${GAME.prepOrder.text}</div></div>`;
            }
        }

        function setTool(t) {
            GAME.activeTool = t;
            document.querySelectorAll('.ingredient-bin').forEach(b => b.classList.remove('active'));
            if (t) document.getElementById('bin-' + t).classList.add('active');
        }

        function handlePrepClick(e) {
            if (!GAME.prepOrder || !GAME.activeTool) return;

            const rect = document.getElementById('prep-pizza').getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const dist = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
            if (dist > (rect.width / 2 - 20)) return; // Too far out

            // visuals
            const el = document.createElement('div');
            el.className = 'topping-item';
            el.textContent = INGREDIENTS[GAME.activeTool].icon;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
            document.getElementById('prep-toppings-container').appendChild(el);

            // data
            GAME.prepToppings.push({
                type: GAME.activeTool,
                x: x, y: y
            });
        }

        function clearPrepPizza() {
            document.getElementById('prep-toppings-container').innerHTML = '';
        }

        function trashPrep() {
            GAME.prepOrder = null;
            GAME.prepToppings = [];
            renderPrepTicket();
            clearPrepPizza();
            document.getElementById('btn-to-oven').disabled = true;
        }

        function movePrepToOven() {
            if (!GAME.prepOrder) return;

            // Find empty slot
            const slotIdx = GAME.ovenSlots.findIndex(s => s === null);
            if (slotIdx === -1) {
                alert("Oven zit vol! Wacht tot er een pizza klaar is.");
                return;
            }

            // Create Pizza Object
            const pizza = {
                order: GAME.prepOrder,
                toppings: [...GAME.prepToppings], // copy
                state: 'BAKING',
                bakeTime: 0,
                heat: 0
            };

            GAME.ovenSlots[slotIdx] = pizza;
            GAME.prepOrder = null;
            renderPrepTicket();
            clearPrepPizza();
            document.getElementById('btn-to-oven').disabled = true;

            // Auto switch? Maybe better not, let user decide
            // Visual feedback?
        }

        // --- OVEN STATION LOGIC ---
        function renderOven() {
            GAME.ovenSlots.forEach((p, i) => updateOvenVisual(i));
        }

        function updateOvenVisual(idx) {
            const slotEl = document.getElementById('slot-' + idx);
            const pizza = GAME.ovenSlots[idx];

            if (!pizza) {
                slotEl.innerHTML = '';
                return;
            }

            // If reusing, check content, but easier to rebuild structure for now
            // Or only update classes if exists
            let html = '';

            // Fire
            html += '<div class="oven-fire"></div>';

            // Info
            if (pizza.state === 'BAKING') {
                html += `<div class="oven-timer" id="timer-${idx}">...</div>`;
            } else {
                html += `<div class="oven-timer" style="background:var(--success)">KLAAR!</div>`;
                html += `<div class="oven-temp-gauge"><div class="oven-temp-fill" id="heat-${idx}" style="height:${pizza.heat}%"></div></div>`;
            }

            // Pizza Base
            // Reconstruct visual roughly? We don't need every individual topping precise x/y in oven view, 
            // but we can scale it down.
            let toppingsHTML = '';
            // Optimization: Don't render all toppings in oven view to save DOM, just simplified representation?
            // User likes visuals, let's try to render them scaled.
            // Original prep board was approx 380px. Oven pizza is 200px. Scale factor ~0.5.
            pizza.toppings.forEach(t => {
                toppingsHTML += `<div style="position:absolute; left:${t.x * 0.5}px; top:${t.y * 0.5}px; font-size:12px; transform:translate(-50%, -50%); pointer-events:none;">${INGREDIENTS[t.type].icon}</div>`;
            });

            const cssClass = pizza.state === 'BAKING' ? 'baking' : 'done';

            html += `
                <div class="pizza-visual oven-pizza ${cssClass}" onclick="clickOvenPizza(${idx})" style="width:190px; height:190px; border-width:4px;">
                    <div class="sauce"></div>
                    ${toppingsHTML}
                </div>
            `;

            slotEl.innerHTML = html;
        }

        function updateOvenTimer(idx, timeLeft) {
            const el = document.getElementById(`timer-${idx}`);
            if (el) el.textContent = Math.ceil(timeLeft) + "s";
        }

        function updateOvenHeat(idx, heat) {
            const el = document.getElementById(`heat-${idx}`);
            if (el) {
                el.style.height = heat + "%";
                // Color scaling
                if (heat < 30) el.style.background = '#3498db'; // Cold
                else if (heat < 60) el.style.background = '#f1c40f'; // Warm
                else el.style.background = '#e74c3c'; // Hot
            }
        }

        function clickOvenPizza(idx) {
            const pizza = GAME.ovenSlots[idx];
            if (!pizza) return;

            if (pizza.state === 'BAKING') {
                // Ignore or show "Wait!"
            } else if (pizza.state === 'BAKED') {
                // Move to Cutting
                if (GAME.cuttingPizza) {
                    alert("Maak eerst de pizza op de snijplank af!");
                    return;
                }
                GAME.cuttingPizza = pizza;
                GAME.cuttingPizza.state = 'CUTTING';
                GAME.selectedCuts = 0;

                GAME.ovenSlots[idx] = null; // Remove from oven
                renderOven();
                updateBadges();
                switchStation('cutting');
            }
        }

        // --- CUTTING STATION LOGIC ---
        function renderCutting() {
            const container = document.getElementById('cutting-board-area');
            const emptyMsg = document.getElementById('cutting-empty-msg');

            if (!GAME.cuttingPizza) {
                container.style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }

            container.style.display = 'flex';
            emptyMsg.style.display = 'none';

            // Order info
            const p = GAME.cuttingPizza;
            document.getElementById('cut-ticket-display').innerHTML = `<div style="font-size:1.2rem;">${p.order.text}</div>`;

            // Render toppings again properly
            const topCont = document.getElementById('cut-toppings-container');
            topCont.innerHTML = '';
            // Identical mapping as prep (380px)
            p.toppings.forEach(t => {
                const el = document.createElement('div');
                el.className = 'topping-item';
                el.textContent = INGREDIENTS[t.type].icon;
                el.style.left = t.x + 'px';
                el.style.top = t.y + 'px';
                topCont.appendChild(el);
            });

            renderCutLines();
        }

        function applyCut(pieces) {
            if (!GAME.cuttingPizza) return;
            GAME.selectedCuts = pieces;
            renderCutLines();
        }

        function renderCutLines() {
            const svg = document.getElementById('cut-overlay');
            svg.innerHTML = ''; // clear

            const n = GAME.selectedCuts;
            if (n <= 0) return;

            // Radius ~ 190px (380/2)
            const cx = "50%";
            const cy = "50%";
            const r = 190;

            // Draw lines
            // n pieces requires n/2 lines if n is even and simple, 
            // but for generic radial: 360/n degrees.
            for (let i = 0; i < n; i++) {
                const deg = (360 / n) * i;
                const rad = deg * (Math.PI / 180);
                // Line from center to edge
                const x2 = 200 + 200 * Math.cos(rad); // 400px container
                const y2 = 200 + 200 * Math.sin(rad);

                // We actually only need lines across, so i < n/2? 
                // No, just drawing radii is fine visual representation of cuts

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", 200);
                line.setAttribute("y1", 200);
                line.setAttribute("x2", x2);
                line.setAttribute("y2", y2);
                line.setAttribute("stroke", "white");
                line.setAttribute("stroke-width", "4");
                line.setAttribute("stroke-dasharray", "10 5");
                svg.appendChild(line);
            }
        }

        function serveFinal() {
            if (!GAME.cuttingPizza) return;

            const p = GAME.cuttingPizza;

            // VALIDATION
            // 1. Math Check (Count of correct ingredient)
            const targetType = p.order.targetType;
            const targetCount = p.order.targetCount;
            const actualCount = p.toppings.filter(t => t.type === targetType).length;
            const wrongCount = p.toppings.filter(t => t.type !== targetType).length;

            // 2. Cut Check
            const targetCuts = p.order.targetCuts;
            const actualCuts = GAME.selectedCuts;

            // 3. Heat Check
            const heat = p.heat;

            // Logic
            let title = "Mwah...";
            let score = 0;
            let desc = "";
            let perfect = true;

            // Count check
            if (actualCount !== targetCount) {
                desc += `❌ Verkeerd aantal toppings (${actualCount} ipv ${targetCount}).<br>`;
                perfect = false;
            }
            if (wrongCount > 0) {
                desc += `❌ Verkeerde ingrediënten erbij.<br>`;
                perfect = false;
            }

            // Cut check
            if (actualCuts !== targetCuts) {
                desc += `❌ Verkeerd gesneden (${actualCuts} stukken ipv ${targetCuts}).<br>`;
                perfect = false;
            } else {
                desc += `✅ Perfect gesneden.<br>`;
            }

            // Heat Score
            let heatBonus = 0;
            if (perfect) {
                if (heat > 80) { heatBonus = 5; desc += "🔥 Lekker heet! (+5)<br>"; }
                else if (heat > 50) { heatBonus = 2; desc += "🌡️ Goede temperatuur. (+2)<br>"; }
                else if (heat < 20) { heatBonus = -2; desc += "🧊 Koud! (-2)<br>"; }

                score = 10 + heatBonus;
                title = "Heerlijk!";
                GAME.money += score;
            } else {
                title = "Dat klopt niet...";
                score = 0;
            }

            // SHOW RESULT
            document.getElementById('res-title').textContent = title;
            document.getElementById('res-desc').innerHTML = desc;
            document.getElementById('res-score').textContent = score > 0 ? "+€" + score : "€0";
            document.getElementById('res-heat').style.width = heat + "%";
            document.getElementById('feedback-overlay').classList.add('visible');

            // Reset
            GAME.cuttingPizza = null;
            document.getElementById('score-display').textContent = GAME.money;
            GAME.day = Math.floor(GAME.money / 100) + 1;
            document.getElementById('day-display').textContent = GAME.day;

            renderCutting();
        }

        function closeFeedback() {
            document.getElementById('feedback-overlay').classList.remove('visible');
            switchStation('prep'); // Go back to prep to make more money
        }

        // Init
        startNewOrder();

    </script>
</body>
